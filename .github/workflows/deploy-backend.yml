name: Deploy Backend to Cloud Run
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GOOGLE_FORM_SECRET: ${{ secrets.GOOGLE_FORM_SECRET }}
          NGO_RESCHEDULE_FORM_URL: ${{ secrets.NGO_RESCHEDULE_FORM_URL }}
          NGO_RESCHEDULE_FORM_EMAIL_ENTRY: ${{ secrets.NGO_RESCHEDULE_FORM_EMAIL_ENTRY }}
          NGO_RESCHEDULE_FORM_DATE_ENTRY: ${{ secrets.NGO_RESCHEDULE_FORM_DATE_ENTRY }}
        run: |
          cd backend
          printf 'ENVIRONMENT: "production"\nALLOWED_ORIGINS: "%s"\nREDIS_URL: "%s"\nGOOGLE_FORM_SECRET: "%s"\nNGO_RESCHEDULE_FORM_URL: "%s"\nNGO_RESCHEDULE_FORM_EMAIL_ENTRY: "%s"\nNGO_RESCHEDULE_FORM_DATE_ENTRY: "%s"\n' \
            "$ALLOWED_ORIGINS" "$REDIS_URL" "$GOOGLE_FORM_SECRET" "$NGO_RESCHEDULE_FORM_URL" "$NGO_RESCHEDULE_FORM_EMAIL_ENTRY" "$NGO_RESCHEDULE_FORM_DATE_ENTRY" > /tmp/env-vars.yaml
          gcloud run deploy aasha-api \
            --source . \
            --region asia-south1 \
            --allow-unauthenticated \
            --project ashaai-prod \
            --vpc-connector=ashaai-connector \
            --vpc-egress=private-ranges-only \
            --env-vars-file=/tmp/env-vars.yaml