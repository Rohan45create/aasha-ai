name: Deploy Backend to Cloud Run
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
# We need permissions to request the OIDC token
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/853020519348/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions@ashaai-backend.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          ALLOWED_ORIGINS: 'https://ashaai-prod.web.app,http://localhost:5173,http://localhost:4173'
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GOOGLE_FORM_SECRET: ${{ secrets.GOOGLE_FORM_SECRET }}
          NGO_RESCHEDULE_FORM_URL: ${{ secrets.NGO_RESCHEDULE_FORM_URL }}
          NGO_RESCHEDULE_FORM_EMAIL_ENTRY: ${{ secrets.NGO_RESCHEDULE_FORM_EMAIL_ENTRY }}
          NGO_RESCHEDULE_FORM_DATE_ENTRY: ${{ secrets.NGO_RESCHEDULE_FORM_DATE_ENTRY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd backend
          printf 'ENVIRONMENT: "production"\nALLOWED_ORIGINS: "%s"\nREDIS_URL: "%s"\nGOOGLE_FORM_SECRET: "%s"\nNGO_RESCHEDULE_FORM_URL: "%s"\nNGO_RESCHEDULE_FORM_EMAIL_ENTRY: "%s"\nNGO_RESCHEDULE_FORM_DATE_ENTRY: "%s"\nGMAIL_SENDER_EMAIL: "%s"\nGMAIL_APP_PASSWORD: "%s"\n' \
            "$ALLOWED_ORIGINS" "$REDIS_URL" "$GOOGLE_FORM_SECRET" "$NGO_RESCHEDULE_FORM_URL" "$NGO_RESCHEDULE_FORM_EMAIL_ENTRY" "$NGO_RESCHEDULE_FORM_DATE_ENTRY" "$GMAIL_SENDER_EMAIL" "$GMAIL_APP_PASSWORD" > /tmp/env-vars.yaml
          gcloud run deploy aasha-api \
            --source . \
            --region asia-south1 \
            --allow-unauthenticated \
            --project ashaai-backend \
            --clear-vpc-connector \
            --memory 1Gi \
            --env-vars-file=/tmp/env-vars.yaml